# Settings `tunnel` uses when nothing overrides them.
#
# Precedence: environment  >  ~/.mcp-tunnel.conf  >  this file.
# Edit here to change them for every machine that clones the repo; edit
# ~/.mcp-tunnel.conf to change them for one machine only.

TUNNEL_HOSTNAME="mcp.tradingbot.casa"   # blank = a new random URL each run
TUNNEL_NAME="evotrader"
SERVER="tradingview"                    # tradingview | training | both
PORT="8787"
ENDPOINT="/mcp"
